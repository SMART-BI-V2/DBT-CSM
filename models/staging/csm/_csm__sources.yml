version: 2

sources:
  - name: csm
    description: Bảng ERP Casumina do đối tác nạp vào Doris (CSDL raw_stage — vùng của đối tác, chỉ đọc).
    schema: "{{ var('csm_source_schema') }}"
    tables:
      - name: source_code
      - name: item_category
      - name: item
      - name: product_group
      - name: customer
      - name: responsibility_center
      - name: location
      - name: customer_template
      - name: customer_posting_group
      - name: department
      - name: hr_department
        description: Phòng ban của hệ thống nhân sự (đối tác nạp từ 23/10/2026; bảng `department` vẫn rỗng).
      - name: hr_employee
        description: Hồ sơ nhân viên (đối tác nạp 28/10/2026). Có thông tin cá nhân (họ tên, địa chỉ, điện thoại, email, ngày sinh) — mart KHÔNG lấy các cột này.
      - name: item_subgroup_1
      - name: manufacturer_costing
      - name: manufacturer_material_costing
      - name: manufacturer_profit
      - name: sale_invoice
      - name: service_invoice
      - name: customer_profit
      - name: production_bom_line
      - name: production_entry
      - name: material_entry
      - name: production_planning
      - name: customer_balance
      - name: balance_account
      - name: company_profit
      # business_planning / business_planning_actual: chưa có trong raw_stage
      # ⇒ đọc qua macro csm_source_or_empty (xem stg_csm__business_planning*.sql).
