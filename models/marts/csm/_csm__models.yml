  - name: fact_csm_plan_company_value
    tests:
      - unique_combination:
          arguments:
            columns: [period_from, ord, measure, entity_code]
    description: "Kế hoạch SXKD cấp CÔNG TY dạng DỌC (cùng nguồn fact_csm_plan_company): mỗi dòng = chỉ tiêu × nhóm đo × đơn vị. Dùng khi cần cơ cấu / tỷ trọng theo đơn vị (lọc entity_code <> 'total' rồi chia cho tổng). measure: production (sản xuất), sales (tiêu thụ), export (xuất khẩu), revenue_after_discount (doanh thu đã trừ chiết khấu — chỉ ở mục revenue). Đơn vị tính theo cột unit."
    columns:
      - name: period_from
        description: "Ngày đầu tháng kế hoạch."
      - name: planningyear
        description: "Năm kế hoạch."
      - name: planningmonth
        description: "Tháng kế hoạch."
      - name: revision
        description: "Lần điều chỉnh của bản kế hoạch (0 = bản đầu, 1 = Đ/c 1 …). Mỗi kỳ chỉ một bản hiệu lực."
      - name: ord
        description: "Thứ tự dòng chỉ tiêu trong tệp."
      - name: category_code
        description: "Mã chỉ tiêu ổn định."
      - name: categoryname
        description: "Tên chỉ tiêu như trong tệp."
      - name: section
        description: "Mục — sxcn | sxcn_actual | revenue | labor | quantity."
      - name: unit
        description: "Đơn vị tính — \"triệu đồng\", \"nghìn\" hoặc trống."
      - name: measure
        description: "Nhóm đo — production | sales | export | revenue_after_discount."
      - name: entity_code
        description: "Đơn vị — 'total' (toàn công ty) hoặc mã xí nghiệp 01, 02, 03, 06, 07, 08 (dim_csm_factory)."
      - name: entity_name
        description: "Tên đơn vị."
      - name: value
        description: "Giá trị kế hoạch (đơn vị tính theo cột unit)."

  - name: fact_csm_plan_factory_product
    tests:
      - unique_combination:
          arguments:
            columns: [period_from, factory_code, product_code]
    description: "Kế hoạch SXKD cấp XÍ NGHIỆP theo SẢN PHẨM, theo tháng (sheet kh_xnhm, kh_xnbd, kh_xnbl, kh_xndn, kh_xnra của tệp KHSX; tương ứng bảng ERP planning_manu_detail). Sản lượng tính bằng CHIẾC; giá bán, giá chuẩn, tiền lương tính bằng đồng/chiếc. So kế hoạch với thực hiện: nối product_code với fact_csm_fg_inventory (sản xuất nhập kho) / fact_csm_sales (tiêu thụ) cùng tháng. Đây là kế hoạch ĐƯỢC DUYỆT (khác bảng kế hoạch ERP fact_csm_production_plan)."
    columns:
      - name: period_from
        description: "Ngày đầu tháng kế hoạch."
      - name: planningyear
        description: "Năm kế hoạch."
      - name: planningmonth
        description: "Tháng kế hoạch."
      - name: revision
        description: "Lần điều chỉnh của bản kế hoạch (0 = bản đầu, 1 = Đ/c 1 …). Mỗi kỳ chỉ một bản hiệu lực."
      - name: batch_id
        description: "Mã lần nhập."
      - name: factory_code
        description: "Mã xí nghiệp (02 Đồng Nai, 03 Hóc Môn, 06 Radial, 07 Bình Lợi, 08 Radial 2 – Bình Dương)."
      - name: product_code
        description: "Mã sản phẩm (MSP, giữ số 0 đầu; khớp dim_csm_product)."
      - name: product_name
        description: "Tên sản phẩm như trong tệp kế hoạch."
      - name: product_group
        description: "Nhóm sản phẩm trong tệp kế hoạch (dòng nhóm gần nhất phía trên, vd \"Nhóm Tubeless\")."
      - name: ord
        description: "Thứ tự dòng trong sheet."
      - name: begin_stock
        description: "Tồn đầu kỳ kế hoạch (chiếc)."
      - name: instock
        description: "Sản xuất kế hoạch (chiếc)."
      - name: outstock
        description: "Tiêu thụ kế hoạch — tổng (chiếc)."
      - name: outstock_export
        description: "Tiêu thụ kế hoạch — xuất khẩu (chiếc)."
      - name: outstock_inland
        description: "Tiêu thụ kế hoạch — nội địa (chiếc)."
      - name: ending_stock
        description: "Tồn cuối kỳ kế hoạch (chiếc)."
      - name: price
        description: "Giá bán kế hoạch (đồng/chiếc)."
      - name: std_price
        description: "Giá chuẩn (đồng/chiếc)."
      - name: wage
        description: "Tiền lương đơn vị (đồng/chiếc)."
      - name: systemdate
        description: "Thời điểm tải bản kế hoạch lên."

  - name: fact_csm_plan_factory_line
    tests:
      - unique_combination:
          arguments:
            columns: [period_from, factory_code, line_code]
    description: "Dòng NHÓM và dòng TỔNG HỢP của kế hoạch xí nghiệp (sheet kh_xn*). line_kind = group: tổng theo nhóm sản phẩm (vd \"Lốp Xe Máy\", \"Nhóm Tubeless\" — chiếc; tương ứng ERP planning_manu_total). line_kind = summary: chỉ tiêu tổng hợp của xí nghiệp — i.a giá trị SXCN (instock, triệu đồng), ii.a / ii.b doanh thu SXCN chưa / đã chiết khấu (outstock = tổng, outstock_export, outstock_inland; triệu đồng), iii lao động – tiền lương (quỹ lương triệu đồng, lao động người, lương bình quân triệu đồng/người)."
    columns:
      - name: period_from
        description: "Ngày đầu tháng kế hoạch."
      - name: planningyear
        description: "Năm kế hoạch."
      - name: planningmonth
        description: "Tháng kế hoạch."
      - name: revision
        description: "Lần điều chỉnh của bản kế hoạch (0 = bản đầu, 1 = Đ/c 1 …). Mỗi kỳ chỉ một bản hiệu lực."
      - name: factory_code
        description: "Mã xí nghiệp."
      - name: line_kind
        description: "group (nhóm sản phẩm) | summary (chỉ tiêu tổng hợp)."
      - name: ord
        description: "Thứ tự dòng trong sheet."
      - name: line_code
        description: "Mã dòng — nhom.<tên nhóm> hoặc mã mục (i.a, ii.a, iii …; dòng con <mục>.<tên>)."
      - name: line_name
        description: "Tên dòng như trong tệp."
      - name: begin_stock
        description: "Tồn đầu kỳ kế hoạch (chiếc với dòng nhóm; triệu đồng với dòng giá trị/doanh thu)."
      - name: instock
        description: "Sản xuất kế hoạch (chiếc với dòng nhóm; triệu đồng với dòng giá trị/doanh thu)."
      - name: outstock
        description: "Tiêu thụ kế hoạch — tổng (chiếc với dòng nhóm; triệu đồng với dòng giá trị/doanh thu)."
      - name: outstock_export
        description: "Tiêu thụ kế hoạch — xuất khẩu (chiếc với dòng nhóm; triệu đồng với dòng giá trị/doanh thu)."
      - name: outstock_inland
        description: "Tiêu thụ kế hoạch — nội địa (chiếc với dòng nhóm; triệu đồng với dòng giá trị/doanh thu)."
      - name: ending_stock
        description: "Tồn cuối kỳ kế hoạch (chiếc với dòng nhóm; triệu đồng với dòng giá trị/doanh thu)."
