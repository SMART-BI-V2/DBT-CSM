name: "casumina_csm"
version: "2.0.0"
config-version: 2

# Bản Doris (nhánh feat/doris). Bản PostgreSQL cũ (dev .179) nằm ở nhánh main.
profile: casumina_csm

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  casumina_csm:
    staging:
      # Chuẩn hoá mã/kiểu ngay trong câu lệnh mart — không sinh view trung gian
      # (role_transform chỉ ghi được raw/mart/ops; mart chỉ chứa bảng cho BI).
      +materialized: ephemeral
    marts:
      +materialized: table
      +buckets: 1
      # Doris 1 BE ⇒ 1 bản sao (fe.conf force_olap_table_replication_num=1)
      +properties:
        replication_num: "1"

vars:
  # CSDL Doris chứa bảng nguồn ERP (đối tác nạp). Thử nghiệm: --vars '{csm_source_schema: tmp_csm_devsrc}'
  csm_source_schema: raw_stage

seeds:
  casumina_csm:
    +properties:
      replication_num: "1"
    seed_department:
      +column_types:
        RowID: int
        Code: varchar(64)
        Description: varchar(512)
        SourceCode: varchar(16)
