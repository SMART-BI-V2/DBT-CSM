name: "casumina_csm"
version: "2.0.0"
config-version: 2

# Bản Doris (nhánh feat/doris). Bản PostgreSQL cũ (dev .179) nằm ở nhánh main.
profile: casumina_csm

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  casumina_csm:
    staging:
      # Chuẩn hoá mã/kiểu ngay trong câu lệnh mart — không sinh view trung gian
      # (role_transform chỉ ghi được raw/mart/ops; mart chỉ chứa bảng cho BI).
      +materialized: ephemeral
    marts:
      +materialized: table
      +buckets: 1
      # Mô tả tiếng Việt (models/marts/csm/_csm__models.yml) ghi vào COMMENT bảng/cột của Doris
      # ⇒ SmartBI / AI / công cụ BI đọc được nghĩa từng cột ngay từ schema.
      +persist_docs:
        relation: true
        columns: true
      # Doris 1 BE ⇒ 1 bản sao (fe.conf force_olap_table_replication_num=1)
      +properties:
        replication_num: "1"

# Chống đọc dữ liệu dở dang: đối tác xoá + nạp lại tháng hiện tại mỗi ~18 phút.
# Trước khi dựng: chờ nguồn yên ≥ csm_quiet_seconds; sau khi dựng: nguồn bị ghi trong lúc dựng ⇒ báo lỗi
# (scripts/dbt_cron.sh dựng lại). Xem macros/csm_source_guard.sql.
on-run-start:
  - "{{ csm_wait_for_quiet_source() }}"
on-run-end:
  - "{{ csm_assert_source_unchanged() }}"

vars:
  # CSDL Doris chứa bảng nguồn ERP (đối tác nạp). Thử nghiệm: --vars '{csm_source_schema: tmp_csm_devsrc}'
  csm_source_schema: raw_stage
  csm_quiet_seconds: 120      # nguồn phải không bị ghi trong ngần này giây
  csm_quiet_max_wait: 1200    # chờ tối đa (giây) rồi báo lỗi
  csm_guard_schema: ops       # nơi ghi mốc kiểm tra tạm (không làm bẩn CSDL mart)
  # Kho nhập dữ liệu Excel qua SmartBI (mô-đun dataIntake). Thử nghiệm: --vars '{intake_schema: tmp_intake_test}'
  intake_schema: intake
